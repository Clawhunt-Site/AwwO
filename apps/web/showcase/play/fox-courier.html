<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>狐狸邮差 · Fox Courier</title>
<style>
  :root { --sky: #9ED8FF; --ink: #3A2418; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--sky); overflow: hidden; touch-action: none;
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif; user-select: none; }
  #wrap { position: absolute; inset: 0; display: grid; place-items: center; }
  #stage { position: relative; }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  .ov { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; color: #fff; pointer-events: none; transition: opacity .35s; }
  .ov.hide { opacity: 0; }
  .ov h1 { margin: 0; font-size: calc(var(--u) * 13); letter-spacing: calc(var(--u) * .8); font-weight: 900; color: #fff;
    text-shadow: 0 calc(var(--u) * .9) 0 #E8664F, 0 calc(var(--u) * 1.8) 0 #8E3B2C, 0 calc(var(--u) * 3) calc(var(--u) * 3) rgba(80,40,30,.35); }
  .ov .sub { margin-top: calc(var(--u) * 3.2); font-size: calc(var(--u) * 4.2); font-weight: 700; color: #5A3A2A;
    background: rgba(255,246,232,.92); padding: calc(var(--u) * .9) calc(var(--u) * 3.4); border-radius: 999px; }
  .ov .go { margin-top: calc(var(--u) * 6); font-size: calc(var(--u) * 4.2); font-weight: 800; color: #fff; background: #FF7A6B;
    padding: calc(var(--u) * 1.3) calc(var(--u) * 5); border-radius: 999px; box-shadow: 0 calc(var(--u) * .8) 0 #C9503F; animation: pulse 1.2s ease-in-out infinite; }
  .ov .hint { margin-top: calc(var(--u) * 3); font-size: calc(var(--u) * 3); color: #fff; background: rgba(58,36,24,.55);
    padding: calc(var(--u) * .7) calc(var(--u) * 3); border-radius: 999px; }
  #title { background: radial-gradient(ellipse at 50% 50%, rgba(255,246,232,.35), rgba(255,246,232,0) 62%); }
  .ov .card { background: rgba(255,246,232,.96); color: #4A2E20; border-radius: calc(var(--u) * 3);
    padding: calc(var(--u) * 5) calc(var(--u) * 9); box-shadow: 0 calc(var(--u) * 2) 0 #E8664F, 0 calc(var(--u) * 5) calc(var(--u) * 6) rgba(60,30,20,.3);
    pointer-events: auto; }
  .ov .card h2 { margin: 0 0 calc(var(--u) * 2); font-size: calc(var(--u) * 9); color: #E8664F; }
  .ov .card p { margin: 0 0 calc(var(--u) * 4); font-size: calc(var(--u) * 3.6); font-weight: 700; }
  .ov button { font: inherit; font-size: calc(var(--u) * 3.6); font-weight: 800; color: #fff; background: #FF7A6B; border: 0;
    border-radius: 999px; padding: calc(var(--u) * 1.6) calc(var(--u) * 6); box-shadow: 0 calc(var(--u) * .8) 0 #C9503F; cursor: pointer; }
  .ov button:active { transform: translateY(calc(var(--u) * .5)); box-shadow: 0 calc(var(--u) * .3) 0 #C9503F; }
  @keyframes pulse { 50% { opacity: .55; transform: scale(.97); } }
  #tag { position: absolute; left: calc(var(--u) * 2.4); bottom: calc(var(--u) * 2.4); font-size: calc(var(--u) * 2.5);
    color: #fff; background: rgba(14,17,22,.55); padding: calc(var(--u) * .6) calc(var(--u) * 2); border-radius: 999px; pointer-events: none; }
  #mute { position: absolute; right: calc(var(--u) * 2.2); top: calc(var(--u) * 2.2); width: calc(var(--u) * 7); height: calc(var(--u) * 7);
    border: 0; border-radius: 999px; background: rgba(255,246,232,.85); color: #4A2E20; font-size: calc(var(--u) * 3.6); cursor: pointer; display: grid; place-items: center; }
  #pause { pointer-events: none; }
  #touch { position: fixed; left: 0; right: 0; bottom: 0; display: none; justify-content: space-between; padding: 14px 18px calc(14px + env(safe-area-inset-bottom)); pointer-events: none; }
  #touch .grp { display: flex; gap: 14px; }
  #touch button { pointer-events: auto; width: 76px; height: 76px; border-radius: 50%; border: 0; background: rgba(255,255,255,.55);
    color: #4A2E20; font-size: 28px; font-weight: 900; box-shadow: 0 4px 0 rgba(0,0,0,.12); touch-action: none; }
  #touch button.on { background: rgba(255,224,138,.9); }
  body.touch #touch { display: flex; }
  body.demo, body.demo * { cursor: none !important; }
  body.demo #mute { display: none; }
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="c" width="400" height="225"></canvas>
  <div id="title" class="ov"><h1 data-t="title"></h1><div class="sub" data-t="sub"></div><div class="go" data-t="go"></div><div class="hint" data-t="hint"></div></div>
  <div id="win" class="ov hide"><div class="card"><h2 data-t="won"></h2><p id="winline"></p><button id="again" data-t="again"></button></div></div>
  <div id="pause" class="ov hide"><div class="sub" data-t="paused"></div></div>
  <button id="mute" aria-label="sound">🔊</button>
  <div id="tag" data-t="tag"></div>
</div></div>
<div id="touch"><div class="grp"><button id="tl">◀</button><button id="tr">▶</button></div><div class="grp"><button id="tj">▲</button></div></div>
<script>
(() => {
'use strict';
// ───────────────────────── setup ─────────────────────────
const Q = new URLSearchParams(location.search);
const DEMO = Q.has('demo'), EN = Q.get('lang') === 'en', FAST = +(Q.get('fast') || 1);   // fast: test the bot at N× speed
const T = EN ? {
  title: 'Fox Courier', sub: 'The sky market · deliver every letter', go: 'Press Space or tap to start', hint: '← → move · Space jump',
  won: 'All delivered!', again: 'Play again', paused: 'Paused · press Esc', tag: 'Illustration · AI-generated', line: (t, n) => `Time ${t} · letters ${n} / 12`
} : {
  title: '狐狸邮差', sub: '空中集市 · 把每一封信送到', go: '按 空格键 或 点击屏幕 开始', hint: '← → 移动 · 空格 跳跃',
  won: '全部送达！', again: '再玩一次', paused: '已暂停 · 按 Esc 继续', tag: '示意 · AI 生成', line: (t, n) => `用时 ${t} · 信件 ${n} / 12`
};
document.documentElement.lang = EN ? 'en' : 'zh-CN';
document.querySelectorAll('[data-t]').forEach(el => { el.textContent = T[el.dataset.t]; });
if (DEMO) document.body.classList.add('demo');
const VW = 400, VH = 225;
const cv = document.getElementById('c'), g = cv.getContext('2d');
g.imageSmoothingEnabled = false;
const stage = document.getElementById('stage');
function fit() {
  const w = innerWidth, h = innerHeight;
  let s = Math.floor(Math.min(w / VW, h / VH));
  if (s < 1) s = Math.min(w / VW, h / VH);            // tiny screens: best fit, not an integer
  cv.style.width = VW * s + 'px'; cv.style.height = VH * s + 'px';
  stage.style.setProperty('--u', (VH * s / 100) + 'px');
}
addEventListener('resize', fit); fit();
if (matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window) document.body.classList.add('touch');

// deterministic randomness
let seed = 20261001;
const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };

// ───────────────────────── palette ─────────────────────────
const C = {
  out: '#4A2717', fox: '#F28C38', foxD: '#D4682A', foxL: '#FFB067', cream: '#FFF1DC', eye: '#2A160C',
  bag: '#3B82F6', bagD: '#2557B8', bagL: '#7DB4FF', strap: '#2557B8',
  coral: '#FF7A6B', coralD: '#D85A4D', mint: '#7FE0C2', mintD: '#4FB89A', butter: '#FFE08A', butterD: '#E8B94F',
  stripeL: '#FFF6E8', wood: '#B9774A', woodD: '#8A5434', woodL: '#D9985F', post: '#7A4A2E',
  grass: '#7CCB6B', grassL: '#A9E28A', grassD: '#4E9E52', rock: '#E39A9A', rockD: '#B96E78', rockL: '#F4C2B8', earth: '#9C6B5C',
  leaf: '#4FB06A', leafL: '#86D58A', pot: '#D9744F', potD: '#A8523A', flowerP: '#FF8FB1', flowerY: '#FFE08A', flowerW: '#FFFFFF',
  lantern: '#FF6B5A', lanternD: '#C2413A', lanternL: '#FFC08A', gold: '#FFD15A',
  env: '#FFF6E8', envD: '#E9D6BC', seal: '#E04B3F', glow: '#FFF3B0',
  sky1: '#8FD3FF', sky2: '#BDE6FF', sky3: '#FFE3C9', cloud: '#FFFFFF', cloudS: '#DCEFFF', far1: '#B6D9F2', far2: '#9CC5E6', far3: '#CFE6F5',
  tower: '#F6E7D0', towerD: '#D9BE9A', roof: '#3E7BD6', roofD: '#2B5BA8', flagR: '#FF7A6B'
};

// ───────────────────────── sprites: rect art + an automatic 1-px outline ─────────────────────────
function sprite(w, h, rects, outline = C.out) {
  const c = document.createElement('canvas'); c.width = w + 2; c.height = h + 2;
  const x = c.getContext('2d');
  for (const [rx, ry, rw, rh, col] of rects) { x.fillStyle = col; x.fillRect(rx + 1, ry + 1, rw, rh); }
  if (outline) {
    const id = x.getImageData(0, 0, c.width, c.height), d = id.data, W = c.width, H = c.height, filled = new Uint8Array(W * H);
    for (let i = 0; i < W * H; i++) filled[i] = d[i * 4 + 3] > 0;
    const [r, gg, b] = [1, 3, 5].map(k => parseInt(outline.slice(k, k + 2), 16));
    for (let yy = 0; yy < H; yy++) for (let xx = 0; xx < W; xx++) {
      const i = yy * W + xx; if (filled[i]) continue;
      if ((xx > 0 && filled[i - 1]) || (xx < W - 1 && filled[i + 1]) || (yy > 0 && filled[i - W]) || (yy < H - 1 && filled[i + W])) {
        d[i * 4] = r; d[i * 4 + 1] = gg; d[i * 4 + 2] = b; d[i * 4 + 3] = 255;
      }
    }
    x.putImageData(id, 0, 0);
  }
  return c;
}
function flipH(s) { const c = document.createElement('canvas'); c.width = s.width; c.height = s.height; const x = c.getContext('2d'); x.translate(s.width, 0); x.scale(-1, 1); x.drawImage(s, 0, 0); return c; }

// the fox, 20×16, facing right; pose = { legs: [backX, frontX, lift...], bob, tail, ears }
function foxFrame(p) {
  const by = p.bob || 0, r = [];
  const tail = p.tail || 0;
  // tail (fluffy, cream tip at the far left)
  r.push([2, 6 + by + tail, 5, 3, C.fox], [1, 7 + by + tail, 2, 2, C.fox], [3, 5 + by + tail, 3, 1, C.fox], [0, 7 + by + tail, 2, 2, C.cream], [4, 8 + by + tail, 3, 1, C.foxD]);
  // body
  r.push([6, 7 + by, 8, 5, C.fox], [6, 11 + by, 8, 1, C.foxD], [8, 10 + by, 5, 2, C.cream], [7, 7 + by, 6, 1, C.foxL]);
  // legs (dark socks)
  for (const [lx, ly, lh] of p.legs) r.push([lx, 12 + by + ly, 2, lh, C.foxD], [lx, 12 + by + ly + lh - 1, 2, 1, C.out]);
  // head
  r.push([12, 3 + by, 6, 5, C.fox], [13, 3 + by, 4, 1, C.foxL], [17, 5 + by, 2, 2, C.fox], [14, 6 + by, 4, 2, C.cream], [18, 6 + by, 1, 1, C.cream]);
  r.push([19, 5 + by, 1, 1, C.eye]);                                   // nose
  r.push([15, 4 + by, 1, 2, C.eye]);                                   // eye
  // ears
  const ey = p.ears || 0;
  r.push([12, 1 + by + ey, 2, 2, C.fox], [12, 1 + by + ey, 1, 1, C.foxD], [15, 1 + by + ey, 2, 2, C.fox], [16, 1 + by + ey, 1, 1, C.foxD]);
  // satchel + strap
  r.push([12, 6 + by, 1, 2, C.strap], [11, 7 + by, 1, 1, C.strap], [8, 8 + by, 4, 3, C.bag], [8, 8 + by, 4, 1, C.bagL], [9, 10 + by, 2, 1, C.bagD], [10, 9 + by, 1, 1, C.butter]);
  return sprite(20, 16, r);
}
const FOX = {
  idle: [foxFrame({ legs: [[7, 0, 3], [12, 0, 3]] }), foxFrame({ legs: [[7, 0, 3], [12, 0, 3]], bob: 1, tail: -1 })],
  run: [
    foxFrame({ legs: [[6, 0, 3], [13, 0, 2]], tail: -1, ears: 0 }),
    foxFrame({ legs: [[7, -1, 3], [12, 0, 3]], bob: -1, tail: 0 }),
    foxFrame({ legs: [[8, 0, 2], [11, 0, 3]], tail: 1 }),
    foxFrame({ legs: [[7, 0, 3], [12, -1, 3]], bob: -1, tail: 0 })
  ],
  up: foxFrame({ legs: [[6, -1, 3], [13, -2, 3]], bob: -1, tail: 1, ears: 1 }),
  down: foxFrame({ legs: [[7, 0, 3], [12, 0, 3]], tail: -2, ears: -1 }),
  squash: foxFrame({ legs: [[7, -1, 2], [12, -1, 2]], bob: 1, tail: 0 })
};
for (const k of Object.keys(FOX)) {
  const v = FOX[k];
  FOX[k] = Array.isArray(v) ? { R: v, L: v.map(flipH) } : { R: [v], L: [flipH(v)] };
}
const HALO = (() => {                                  // a soft round glow behind each envelope, in pixel rings
  const c = document.createElement('canvas'); c.width = 26; c.height = 25; const x = c.getContext('2d');
  for (const [r, a] of [[12, .14], [9, .22], [6, .3]]) { x.fillStyle = `rgba(255,236,150,${a})`; for (let yy = -r; yy <= r; yy++) { const hw = Math.floor(Math.sqrt(r * r - yy * yy)); x.fillRect(13 - hw, 12 + yy, hw * 2, 1); } }
  return c;
})();
const ENV = sprite(12, 9, [[0, 0, 12, 9, C.env], [0, 0, 12, 1, '#FFFFFF'], [1, 1, 5, 4, C.envD], [6, 1, 5, 4, C.envD], [2, 2, 3, 2, C.env], [7, 2, 3, 2, C.env], [5, 4, 2, 2, C.seal], [4, 5, 4, 1, C.seal], [0, 8, 12, 1, C.envD]]);
const LANTERN = [0, 1].map(k => sprite(7, 11, [[3, 0, 1, 2, C.post], [1, 2, 5, 1, C.lanternD], [0, 3, 7, 5, C.lantern], [1, 3, 2, 5, k ? C.lanternL : '#FF8E74'], [0, 5, 7, 1, C.lanternD], [1, 8, 5, 1, C.lanternD], [3, 9, 1, 2, C.gold]]));
const FLAG = [0, 1].map(k => sprite(10, 18, [[0, 0, 2, 18, C.post], [2, 1, 7, 5, k ? C.mint : C.coral], [2, 1, 7, 1, '#FFFFFF'], [8, 6, 1, 1, k ? C.mintD : C.coralD]]));
const CRATE = sprite(12, 10, [[0, 0, 12, 10, C.woodL], [0, 0, 12, 1, '#F1BA7C'], [1, 1, 10, 8, C.wood], [5, 0, 2, 10, C.woodD], [0, 4, 12, 2, C.woodD]]);
const PLANTS = [
  sprite(10, 12, [[2, 7, 6, 5, C.pot], [2, 7, 6, 1, '#F09A72'], [3, 11, 4, 1, C.potD], [4, 1, 2, 6, C.leaf], [1, 3, 3, 3, C.leaf], [6, 2, 3, 3, C.leafL], [3, 0, 2, 2, C.flowerP], [7, 1, 2, 2, C.flowerY]]),
  sprite(10, 12, [[2, 7, 6, 5, C.mintD], [2, 7, 6, 1, C.mint], [1, 2, 3, 5, C.leaf], [4, 0, 2, 7, C.leafL], [6, 1, 3, 6, C.leaf], [2, 1, 1, 1, C.flowerW], [7, 0, 2, 2, C.flowerP]])
];
const MAILBOX = sprite(22, 38, [
  [8, 14, 6, 24, C.towerD], [9, 14, 4, 24, C.tower],                       // post
  [2, 4, 18, 12, C.coral], [2, 4, 18, 2, '#FF9C8E'], [2, 14, 18, 2, C.coralD], // box
  [0, 2, 22, 3, C.roof], [0, 2, 22, 1, '#6FA2EE'], [4, 0, 14, 2, C.roofD],     // roof
  [6, 8, 10, 2, C.out], [17, 6, 2, 6, C.butter], [17, 6, 4, 2, C.butter],     // slot + flag
  [3, 34, 16, 4, C.towerD]
]);
const BIRD = [0, 1].map(k => sprite(7, 4, k ? [[0, 0, 2, 1, '#6C8DB5'], [5, 0, 2, 1, '#6C8DB5'], [2, 1, 3, 1, '#6C8DB5'], [3, 2, 1, 1, '#6C8DB5']] : [[0, 2, 2, 1, '#6C8DB5'], [5, 2, 2, 1, '#6C8DB5'], [2, 1, 3, 1, '#6C8DB5'], [3, 2, 1, 1, '#6C8DB5']], null));

// pixel font for the HUD (3×5 digits + '/')
const FONT = { '0': '111101101101111', '1': '010110010010111', '2': '111001111100111', '3': '111001111001111', '4': '101101111001001', '5': '111100111001111',
  '6': '111100111101111', '7': '111001010010010', '8': '111101111101111', '9': '111101111001111', '/': '001001010100100', ':': '000010000010000' };
function ptext(s, x, y, col, sc = 1) {
  for (const ch of s) {
    const f = FONT[ch]; if (f) for (let i = 0; i < 15; i++) if (f[i] === '1') { g.fillStyle = col; g.fillRect(x + (i % 3) * sc, y + Math.floor(i / 3) * sc, sc, sc); }
    x += 4 * sc;
  }
}

// ───────────────────────── the level (one-way platforms, px) ─────────────────────────
// kind: island · stall (awning colour) · cloud (moves) · spring (bouncy awning) · bridge
const P = [
  { x: 0, y: 170, w: 170, kind: 'island' },
  { x: 205, y: 150, w: 82, kind: 'stall', aw: 'coral' },
  { x: 322, y: 126, w: 96, kind: 'stall', aw: 'mint' },
  { x: 462, y: 164, w: 136, kind: 'island' },
  { x: 612, y: 140, w: 52, kind: 'cloud', x0: 612, x1: 740, sp: 32 },
  { x: 800, y: 158, w: 132, kind: 'island', flag: 842 },
  { x: 960, y: 172, w: 34, kind: 'spring' },
  { x: 1010, y: 86, w: 92, kind: 'stall', aw: 'butter' },
  { x: 1140, y: 112, w: 90, kind: 'stall', aw: 'coral' },
  { x: 1276, y: 150, w: 146, kind: 'island', flag: 1316 },
  { x: 1462, y: 130, w: 60, kind: 'stall', aw: 'mint' },
  { x: 1560, y: 110, w: 60, kind: 'stall', aw: 'butter' },
  { x: 1658, y: 92, w: 62, kind: 'stall', aw: 'coral' },
  { x: 1760, y: 118, w: 200, kind: 'bridge' },
  { x: 2000, y: 160, w: 120, kind: 'island' },
  { x: 2158, y: 150, w: 250, kind: 'island', goal: 2340 }
];
const LEVEL_W = 2420;
const ENVS0 = [[236, 128], [368, 102], [534, 140], [705, 118], [872, 134], [1052, 60], [1186, 88], [1350, 126], [1590, 86], [1690, 66], [1868, 94], [2058, 136]];
const SPRING = P.find(p => p.kind === 'spring');

// ───────────────────────── state ─────────────────────────
const S = { mode: DEMO ? 'play' : 'title', t: 0, time: 0, got: 0, cam: 0, won: false, wonT: 0, paused: false };
const fox = { springT: 0, x: 24, y: 150, vx: 0, vy: 0, face: 1, ground: null, coyote: 0, buffer: 0, jumpHeld: false, anim: 0, squash: 0, cp: { x: 24, y: 150 }, puff: 0 };
let envs = [], parts = [], flags = {};
function reset() {
  fox.x = 24; fox.y = 150; fox.vx = 0; fox.vy = 0; fox.face = 1; fox.ground = null; fox.cp = { x: 24, y: 150 }; fox.squash = 0;
  envs = ENVS0.map(([x, y], i) => ({ x, y, got: false, ph: i * .7 }));
  parts = []; flags = {}; S.got = 0; S.time = 0; S.won = false; S.wonT = 0; S.cam = 0;
  for (const p of P) if (p.kind === 'cloud') { p.x = p.x0; p.dir = 1; }
  seed = 20261001;
}
reset();

// ───────────────────────── input ─────────────────────────
const key = { l: false, r: false, j: false };
const bot = { l: false, r: false, j: false };
addEventListener('keydown', e => {
  if (DEMO) return;
  const k = e.code;
  if (['ArrowLeft', 'KeyA'].includes(k)) key.l = true;
  if (['ArrowRight', 'KeyD'].includes(k)) key.r = true;
  if (['Space', 'ArrowUp', 'KeyW'].includes(k)) { if (!key.j) fox.buffer = .1; key.j = true; e.preventDefault(); }
  if (k === 'KeyM') toggleMute();
  if (k === 'KeyR') { reset(); hideWin(); }
  if (k === 'Escape' && S.mode === 'play' && !S.won) setPaused(!S.paused);
  if ((k === 'Space' || k === 'Enter') && S.mode === 'title') start();
  if ((k === 'Space' || k === 'Enter') && S.won && S.wonT > 1) { reset(); hideWin(); }
  audioUnlock();
});
addEventListener('keyup', e => {
  const k = e.code;
  if (['ArrowLeft', 'KeyA'].includes(k)) key.l = false;
  if (['ArrowRight', 'KeyD'].includes(k)) key.r = false;
  if (['Space', 'ArrowUp', 'KeyW'].includes(k)) key.j = false;
});
function hold(id, k) {
  const b = document.getElementById(id);
  const on = e => { e.preventDefault(); audioUnlock(); if (S.mode === 'title') start(); if (k === 'j' && !key.j) fox.buffer = .1; key[k] = true; b.classList.add('on'); };
  const off = e => { e.preventDefault(); key[k] = false; b.classList.remove('on'); };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('pointerleave', off);
}
hold('tl', 'l'); hold('tr', 'r'); hold('tj', 'j');
stage.addEventListener('pointerdown', () => { audioUnlock(); if (S.mode === 'title') start(); });
document.getElementById('again').addEventListener('click', () => { reset(); hideWin(); });
document.getElementById('mute').addEventListener('click', e => { e.stopPropagation(); toggleMute(); });
addEventListener('blur', () => { if (!DEMO && S.mode === 'play' && !S.won) setPaused(true); });
function setPaused(v) { S.paused = v; document.getElementById('pause').classList.toggle('hide', !v); }

  }

  g.fillStyle = C.leaf; for (let vx = 10; vx < w - 8; vx += 23) { const len = 8 + ((vx * 7) % 13); g.fillRect(x + vx, y + 4, 1, len); g.fillStyle = C.leafL; g.fillRect(x + vx - 1, y + 4 + len - 2, 3, 2); g.fillStyle = C.leaf; }
  // the grassy top
  g.fillStyle = C.grassD; g.fillRect(x, y, w, 5); g.fillStyle = C.grass; g.fillRect(x, y - 1, w, 4); g.fillStyle = C.grassL; g.fillRect(x + 1, y - 1, w - 2, 1);
  for (let gx = 2; gx < w - 2; gx += 5) { g.fillStyle = C.grassL; g.fillRect(x + gx, y - 2, 1, 1); }
  // dressing: bushes, flowers and (on the wide ones) a little blossom tree — kept clear of the flag and the mailbox
  const k = p.x / 50 | 0;
  if (w > 120 && !p.goal) tree(x + w - 30 - (k % 3) * 9, y - 1);
  bush(x + 12, y - 1, 5, C.grassD, C.grass); bush(x + 19, y - 1, 3, C.grassD, C.grass);
  for (let fx = 26; fx < w - 40; fx += 17 + (k % 5)) { g.fillStyle = [C.flowerP, C.flowerY, C.flowerW][(fx + k) % 3]; g.fillRect(x + fx, y - 3, 2, 2); g.fillStyle = C.grassD; g.fillRect(x + fx, y - 1, 1, 1); }
}
function drawStall(p, x, t) {
  const w = p.w, y = p.y, [ac, ad] = AWN[p.aw];
  // posts and the awning above the deck
  g.fillStyle = C.post; g.fillRect(x + 3, y - 34, 3, 34); g.fillRect(x + w - 6, y - 34, 3, 34);
  stripes(x - 2, y - 40, w + 4, 7, ac, ad);
  g.fillStyle = C.woodD; g.fillRect(x - 3, y - 42, w + 6, 2);
  if ((p.x / 100 | 0) % 2 === 0) {                     // a tiled roof, ends curling up
    const ry = y - 52, rc = p.aw === 'mint' ? ['#3E7BD6', '#2B5BA8', '#6FA2EE'] : ['#2F9E8F', '#1F7468', '#5CC7B5'];
    g.fillStyle = rc[1]; g.fillRect(x - 6, ry + 6, w + 12, 4);
    g.fillStyle = rc[0]; g.fillRect(x - 4, ry + 2, w + 8, 5); g.fillRect(x - 7, ry + 5, 3, 2); g.fillRect(x + w + 4, ry + 5, 3, 2); g.fillRect(x - 8, ry + 3, 2, 2); g.fillRect(x + w + 6, ry + 3, 2, 2);
    g.fillStyle = rc[2]; for (let tx = 0; tx < w + 8; tx += 4) g.fillRect(x - 4 + tx, ry + 2, 2, 1);
    g.fillStyle = rc[1]; for (let tx = 2; tx < w + 8; tx += 4) g.fillRect(x - 4 + tx, ry + 3, 1, 4);
    g.fillStyle = C.post; g.fillRect(x + 4, ry + 9, 2, 3); g.fillRect(x + w - 6, ry + 9, 2, 3);
  }
  if (w > 70) {                                        // a hanging sign with an envelope on it
    g.fillStyle = C.post; g.fillRect(x + w / 2 - 6, y - 33, 1, 4); g.fillRect(x + w / 2 + 5, y - 33, 1, 4);
    g.fillStyle = C.roof; g.fillRect(x + w / 2 - 8, y - 29, 16, 11); g.fillStyle = '#6FA2EE'; g.fillRect(x + w / 2 - 8, y - 29, 16, 1);
    g.fillStyle = C.env; g.fillRect(x + w / 2 - 5, y - 27, 10, 7); g.fillStyle = C.seal; g.fillRect(x + w / 2 - 1, y - 24, 2, 2);
  }
  // goods on the counter: a crate, a plant, alternating
  if (w > 70) { g.drawImage(CRATE, x + 10, y - 12); g.drawImage(PLANTS[(p.x / 40 | 0) % 2], x + w - 22, y - 14); }
  else g.drawImage(PLANTS[(p.x / 40 | 0) % 2], x + w / 2 - 6, y - 14);
  // lanterns hanging from the awning
  g.drawImage(LANTERN[Math.floor(t * 3 + p.x) % 2], x + 8, y - 33); if (w > 70) g.drawImage(LANTERN[Math.floor(t * 3 + p.x + 1) % 2], x + w - 16, y - 33);
  // deck planks
  g.fillStyle = C.woodD; g.fillRect(x, y, w, 7); g.fillStyle = C.wood; g.fillRect(x, y, w, 5); g.fillStyle = C.woodL; g.fillRect(x, y, w, 1);
  for (let px = 0; px < w; px += 12) { g.fillStyle = C.woodD; g.fillRect(x + px, y + 1, 1, 4); }
  // supports below, with a little rock
  g.fillStyle = C.woodD; g.fillRect(x + 6, y + 7, 3, 9); g.fillRect(x + w - 9, y + 7, 3, 9);
  for (let yy = 0; yy < 12; yy++) { const inset = 2 + Math.floor(yy * yy / 7); if (w - inset * 2 < 6) break; g.fillStyle = yy < 3 ? C.grass : yy % 5 < 2 ? C.rock : C.rockD; g.fillRect(x + inset, y + 15 + yy, w - inset * 2, 1); }
  g.fillStyle = C.grassL; g.fillRect(x + 3, y + 15, w - 6, 1);
  g.fillStyle = C.leaf; for (let vx = 8; vx < w - 6; vx += 19) { const len = 6 + ((vx * 5 + p.x) % 9); g.fillRect(x + vx, y + 17, 1, len); g.fillStyle = C.leafL; g.fillRect(x + vx - 1, y + 17 + len - 2, 3, 2); g.fillStyle = C.leaf; }
}
function drawBridge(p, x, t) {
  const w = p.w, y = p.y;
  // bunting
  for (let i = 0; i < w; i += 8) { const sag = Math.round(Math.sin(i / w * Math.PI) * 6); g.fillStyle = [C.coral, C.mint, C.butter][(i / 8) % 3]; g.fillRect(x + i + 2, y - 30 + sag, 4, 3); g.fillRect(x + i + 3, y - 27 + sag, 2, 2); }
  g.fillStyle = C.post; g.fillRect(x, y - 34, 3, 34); g.fillRect(x + w - 3, y - 34, 3, 34); g.fillRect(x + w / 2 - 1, y - 30, 3, 30);
  g.drawImage(LANTERN[Math.floor(t * 3) % 2], x + w / 2 - 3, y - 26);
  // planks with gaps, ropes
  for (let px = 0; px < w; px += 9) { g.fillStyle = C.woodD; g.fillRect(x + px, y, 8, 6); g.fillStyle = C.woodL; g.fillRect(x + px, y, 8, 1); g.fillStyle = C.wood; g.fillRect(x + px, y + 1, 8, 4); }
  g.fillStyle = '#D9B98A'; g.fillRect(x, y - 8, w, 1);
}
function drawCloudPlat(p, x) {
  const puff = (cx, cy, r, col) => { g.fillStyle = col; for (let yy = -r; yy <= r; yy++) { const hw = Math.floor(Math.sqrt(r * r - yy * yy)); g.fillRect(x + cx - hw, p.y + cy + yy, hw * 2, 1); } };
  for (const [col, d] of [[C.cloudS, 2], ['#FFFFFF', 0]]) { puff(10, 3 + d, 7, col); puff(22, 0 + d, 9, col); puff(36, 2 + d, 8, col); puff(46, 4 + d, 5, col); }
  g.fillStyle = '#FFFFFF'; g.fillRect(x + 2, p.y - 1, p.w - 4, 4); g.fillStyle = C.cloudS; g.fillRect(x + 4, p.y + 9, p.w - 8, 2);
}
function y0(p) { return p.y; }
function drawSpring(p, x) {
  const sq = Math.round((p.boing || 0) * 4);
  g.fillStyle = C.post; g.fillRect(x + 4, p.y + 2, 3, 18); g.fillRect(x + p.w - 7, p.y + 2, 3, 18);
  stripes(x - 3, p.y - 2 + sq, p.w + 6, 5, C.coral, C.coralD);
  g.fillStyle = C.rockD; g.fillRect(x - 2, p.y + 18, p.w + 4, 5); g.fillStyle = C.rock; g.fillRect(x, p.y + 18, p.w, 2);
}
function drawGoal(p, x, t) {
  const mx = x + (p.goal - p.x);
  g.drawImage(MAILBOX, mx, p.y - 40);
  if (S.won) { g.fillStyle = 'rgba(255,240,170,' + (.4 + .3 * Math.sin(t * 8)).toFixed(2) + ')'; g.fillRect(mx + 4, p.y - 34, 16, 8); }
}
function draw(t) {
  const cam = Math.round(S.cam);
  drawBG(cam, t);
  for (const p of P) {
    const x = Math.round(p.x - cam); if (x > VW + 40 || x + p.w < -40) continue;
    if (p.kind === 'island') drawIsland(p, x); else if (p.kind === 'stall') drawStall(p, x, t); else if (p.kind === 'bridge') drawBridge(p, x, t);
    else if (p.kind === 'cloud') drawCloudPlat(p, x); else if (p.kind === 'spring') drawSpring(p, x);
    if (p.flag) g.drawImage(FLAG[flags[p.flag] ? 1 : 0], Math.round(p.flag - cam), p.y - 19);
    if (p.goal) drawGoal(p, x, t);
  }
  // envelopes with a soft glow
  for (const e of envs) {
    if (e.got) continue; const x = Math.round(e.x - cam), y = Math.round(e.y + Math.sin(t * 3 + e.ph) * 2);
    if (x < -20 || x > VW + 20) continue;
    g.drawImage(HALO, x - 7, y - 8);
    g.drawImage(ENV, x, y);
    if ((t * 4 + e.ph) % 3 < .3) { g.fillStyle = '#FFFFFF'; g.fillRect(x + 11, y - 2, 1, 3); g.fillRect(x + 10, y - 1, 3, 1); }
  }
  // the fox
  let fr;
  if (fox.squash > 0 && fox.ground) fr = FOX.squash;
  else if (!fox.ground) fr = fox.vy < 0 ? FOX.up : FOX.down;
  else if (Math.abs(fox.vx) > 12) fr = FOX.run;
  else fr = FOX.idle;
  const frames = fr[fox.face > 0 ? 'R' : 'L'];
  const k = frames.length > 1 ? Math.floor((Math.abs(fox.vx) > 12 ? t * 12 : t * 2)) % frames.length : 0;
  g.drawImage(frames[k], Math.round(fox.x - cam - 1), Math.round(fox.y - 1));
  // particles
  for (const q of parts) {
    const x = Math.round(q.x - cam), y = Math.round(q.y);
    if (q.txt) { g.globalAlpha = Math.min(1, q.life * 2); ptext('+1', x, y, '#FFFFFF'); g.globalAlpha = 1; continue; }
    g.globalAlpha = Math.min(1, q.life * 3); g.fillStyle = q.col; g.fillRect(x, y, q.s, q.s); g.globalAlpha = 1;
  }
  // HUD
  if (S.mode !== 'title') {
    g.fillStyle = 'rgba(74,39,23,.35)'; g.fillRect(6, 6, 46, 15); g.fillStyle = 'rgba(255,246,232,.92)'; g.fillRect(5, 5, 46, 15);
    g.drawImage(ENV, 7, 8);
    ptext(`${S.got}/12`, 23, 9, '#4A2717', 1);
  }
}

// ───────────────────────── loop ─────────────────────────
let last = performance.now(), acc = 0, clock = 0;
const DT = 1 / 120;
function frame(now) {
  const el = Math.max(0, Math.min(.05, (now - last) / 1000)); last = now; clock += el;   // rAF can stamp a hair before performance.now()
  if (!S.paused) {
    if (S.mode === 'play') { acc += el * FAST; while (acc >= DT) { step(DT); acc -= DT; } if (S.won) S.wonT += el; }
    else { // title: the fox trots on the first island behind the overlay
      for (const p of P) if (p.kind === 'cloud') { p.x += p.dir * p.sp * el; if (p.x > p.x1 || p.x < p.x0) p.dir *= -1; }
      fox.x = 60 + Math.sin(clock * .7) * 40; fox.vx = Math.cos(clock * .7) * 28; fox.face = fox.vx >= 0 ? 1 : -1; fox.ground = P[0]; fox.y = P[0].y - 16;
    }
    const look = fox.face * 34, tgt = Math.max(0, Math.min(LEVEL_W - VW, fox.x + 10 - VW / 2 + look));
    S.cam += (tgt - S.cam) * Math.min(1, el * 3.2);
  }
  scheduleMusic();
  draw(clock);
  requestAnimationFrame(frame);
}
if (DEMO) { document.getElementById('title').classList.add('hide'); reset(); }
requestAnimationFrame(frame);
})();
</script>
