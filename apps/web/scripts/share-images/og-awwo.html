<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!--
  AwwO's link preview (public/og-awwo.jpg, 1200 × 630), the image saas.html's og:image and twitter:image name: what a
  chat app or a social site shows for a shared AwwO link. Drawn as the sign-in page's first screen is (the dark tank,
  the orb, the brand), with a canvas of four nodes at work. Rendered in headless Chrome at 1200 × 630, device scale 1,
  from this file: Mona Sans from src/saas/design/fonts, and the Chinese in PingFang SC, where the app's own font stack
  (tokens.css --saas-font) falls back to on a Mac. Saved as a progressive JPEG at quality 90 without chroma
  subsampling (80 KB; the PNG was 366 KB, which some link scrapers refuse or shrink).
-->
<style>
@font-face { font-family: 'Mona Sans'; src: url('../../src/saas/design/fonts/mona-sans-wdth-wght.woff2') format('woff2'); font-weight: 200 900; font-stretch: 75% 125%; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
body {
  position: relative; color: #eaf3f5; font-family: 'Mona Sans', 'PingFang SC', sans-serif; -webkit-font-smoothing: antialiased;
  background:
    radial-gradient(58% 72% at 84% 20%, rgb(95 227 232 / 17%), transparent 70%),
    radial-gradient(52% 64% at 10% 110%, rgb(118 100 236 / 18%), transparent 72%),
    linear-gradient(160deg, #06202b 0%, #041219 58%, #030d14 100%);
}
.orb {
  position: absolute; right: -170px; top: -112px; width: 620px; height: 620px; border-radius: 50%; opacity: .85;
  background:
    radial-gradient(circle at 33% 25%, rgb(255 255 255 / 70%) 0 2%, rgb(255 255 255 / 0%) 12%),
    radial-gradient(circle at 50% 57%, rgb(236 253 255 / 60%) 0 3%, rgb(95 227 232 / 40%) 12%, rgb(118 100 236 / 18%) 34%, transparent 60%),
    radial-gradient(circle at 50% 50%, rgb(18 56 90 / 70%) 0 48%, transparent 72%);
  box-shadow: inset 0 0 0 1px rgb(255 255 255 / 8%), 0 0 140px -20px rgb(63 214 224 / 26%);
}
.brand { position: absolute; left: 80px; top: 74px; display: flex; align-items: center; gap: 14px; font: 700 34px/1 'Mona Sans'; font-stretch: 88%; letter-spacing: -.02em; }
.brand svg { width: 42px; height: 42px; }
h1 { position: absolute; left: 80px; top: 176px; width: 600px; margin: 0; font: 680 60px/1.16 'Mona Sans', 'PingFang SC'; font-stretch: 78%; }
h1 span { display: block; white-space: nowrap; }
.en { position: absolute; left: 82px; top: 352px; width: 560px; margin: 0; color: #aec3ca; font: 500 25px/1.45 'Mona Sans'; font-stretch: 92%; }
.facts { position: absolute; left: 82px; top: 448px; display: flex; gap: 10px; margin: 0; padding: 0; list-style: none; }
.facts li { padding: 9px 16px; border: 1px solid rgb(140 200 220 / 22%); border-radius: 999px; background: rgb(9 30 45 / 62%); color: #d6e6ea; font: 500 19px/1 'PingFang SC', 'Mona Sans'; }
.site { position: absolute; left: 82px; bottom: 58px; color: #6cc6c8; font: 600 21px/1 'Mona Sans'; letter-spacing: .01em; }
.canvas {
  position: absolute; right: 64px; top: 172px; width: 410px; height: 290px; padding: 18px;
  border: 1px solid rgb(140 200 220 / 18%); border-radius: 26px; background: rgb(9 30 45 / 66%);
  box-shadow: 0 24px 60px -18px rgb(0 0 0 / 65%);
  background-image: radial-gradient(rgb(234 243 245 / 9%) 1px, transparent 1.4px); background-size: 20px 20px;
}
.canvas svg.edges { position: absolute; inset: 0; width: 100%; height: 100%; }
.node {
  position: absolute; width: 150px; padding: 12px 14px; border: 1px solid rgb(140 200 220 / 24%); border-radius: 14px;
  background: #0c2230; box-shadow: 0 10px 24px -14px rgb(0 0 0 / 70%);
}
.node b { display: block; color: #eaf3f5; font: 650 18px/1.2 'PingFang SC', 'Mona Sans'; }
.node i { display: flex; align-items: center; gap: 6px; margin-top: 8px; color: #aec3ca; font: 500 13px/1 'PingFang SC', 'Mona Sans'; font-style: normal; }
.node i::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--dot); box-shadow: 0 0 10px var(--dot); }
.done { --dot: #2f9e6b; }
.running { --dot: #2bb3bb; border-color: rgb(43 179 187 / 70%); box-shadow: 0 0 0 4px rgb(43 179 187 / 16%), 0 10px 24px -14px rgb(0 0 0 / 70%); }
.waiting { --dot: #7d8f97; }
</style>
</head>
<body>
<div class="orb"></div>
<div class="brand"><svg viewBox="0 0 256 256" aria-hidden="true"><defs><linearGradient id="g" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#4c9cf5"/><stop offset="1" stop-color="#2f7df6"/></linearGradient></defs><g fill="url(#g)" transform="translate(10 0) scale(.92 1.12)"><path d="M61 34C80 26 99 33 109 51L198 205H146L64 64L48 92L113 205H62L11 115C4 103 5 89 12 77L35 48C42 43 50 38 61 34Z"/><path d="M151 34C170 26 191 35 200 51L246 133C253 145 252 157 245 169L224 205L195 155L158 91L143 118L118 75L137 45C141 40 146 37 151 34Z"/></g></svg>AwwO</div>
<h1><span>让 Agent</span><span>在同一张画布上协作。</span></h1>
<p class="en">Bring your agents together on one canvas: one brief, a team of agents, every step delivered.</p>
<ul class="facts"><li>写下目标</li><li>确认分工</li><li>按依赖运行</li></ul>
<div class="site">awwo.clawhunt.store</div>
<div class="canvas">
  <!-- 规划 → 页面, 规划 → 接口, 页面 → 审核, 接口 → 审核: the review waits on both. -->
  <svg class="edges" viewBox="0 0 408 288" aria-hidden="true" fill="none" stroke="rgb(108 198 200 / 60%)" stroke-width="2" stroke-linecap="round">
    <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="rgb(108 198 200 / 80%)" stroke="none"/></marker></defs>
    <path d="M170 67 L230 67" marker-end="url(#arrow)"/>
    <path d="M93 104 L93 170" marker-end="url(#arrow)"/>
    <path d="M311 104 L311 170" marker-end="url(#arrow)"/>
    <path d="M170 211 L230 211" marker-end="url(#arrow)"/>
  </svg>
  <div class="node done" style="left: 18px; top: 32px"><b>规划</b><i>已完成</i></div>
  <div class="node running" style="left: 236px; top: 32px"><b>页面</b><i>运行中</i></div>
  <div class="node done" style="left: 18px; top: 176px"><b>接口</b><i>已完成</i></div>
  <div class="node waiting" style="left: 236px; top: 176px"><b>审核</b><i>等待上游</i></div>
</div>
</body>
</html>
