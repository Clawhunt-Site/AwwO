server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index saas.html;
    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    # Files attached on a canvas: any type, up to the API's AWWO_UPLOAD_MAX_MB (64 by default). Only this route
    # takes more than the 2m above; nginx buffers the body so the API reads it at local speed.
    location ~ ^/api/v1/tenants/[^/]+/canvases/[^/]+/uploads$ {
        client_max_body_size 70m;
        client_body_buffer_size 1m;
        proxy_pass http://api:8087;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering on;
        proxy_read_timeout 1300s;
        proxy_send_timeout 1300s;
    }
    location /api/v1/ {
        proxy_pass http://api:8087;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 660s;
    }
    # The homepage's case footage and playable mock-ups: a missing file is a 404, never the app's HTML.
    location /showcase/ { try_files $uri =404; }
    # The figure kit a downloaded figure page loads (apps/web/src/canvas/figureKit): likewise a 404 when missing.
    location /kits/ { try_files $uri =404; }
    # The license texts the app links (/third-party-licenses.txt; under /assets/, pdf.js's, Mona Sans's and the skill
    # library's) are UTF-8 and hold a (c) sign: say so, or a browser may show it garbled, as the hosted site's nginx
    # does since 2026-10-17 (docs/awwo-saas-deploy.md). charset_types adds text/html by itself; neither path serves HTML.
    location = /third-party-licenses.txt { charset utf-8; charset_types text/plain; }
    location ~ ^/assets/.*\.txt$ { charset utf-8; charset_types text/plain; try_files $uri =404; }
    # PDF.js module workers must retain a JavaScript MIME type with nosniff enabled.
    location ~ ^/assets/.*\.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }
    location / { try_files $uri /saas.html; }
}
