name: awwo-saas
# Backend instrumentation only; collectors and scrape access are operated separately.
x-backend-telemetry: &backend-telemetry
  AWWO_METRICS_ENABLED: ${AWWO_METRICS_ENABLED:-false}
  AWWO_OTEL_ENABLED: ${AWWO_OTEL_ENABLED:-false}
  AWWO_REVISION: ${AWWO_REVISION:-unknown}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
  OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.05}
services:
  database:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_USER: awwo
      POSTGRES_DB: awwo
      POSTGRES_PASSWORD: ${AWWO_DB_PASSWORD:?Set a dedicated database password}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U awwo -d awwo]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [private]
  pi:
    build:
      context: ../..
      dockerfile: deploy/saas/pi.Dockerfile
    # Only the Pi container receives these optional profile-specific credentials.
    env_file:
      - path: ${AWWO_PI_PROFILES_ENV_FILE:-./pi-profiles.env}
        required: false
    environment:
      <<: *backend-telemetry
      APP_ENV: ${APP_ENV:-staging}
      OTEL_SERVICE_NAME: awwo-pi-worker
      AWWO_PI_HOST: 0.0.0.0
      AWWO_PI_PORT: 8097
      AWWO_PI_TOKEN: ${AWWO_PI_TOKEN:?Set a dedicated internal token}
      AWWO_PI_PROVIDER: ${AWWO_PI_PROVIDER:-}
      AWWO_PI_MODEL: ${AWWO_PI_MODEL:-}
      AWWO_PI_BASE_URL: ${AWWO_PI_BASE_URL:-}
      AWWO_PI_API_KEY: ${AWWO_PI_API_KEY:-}
      AWWO_PI_MODELS_JSON: ${AWWO_PI_MODELS_JSON:-}
      AWWO_PI_MAX_CONCURRENCY: ${AWWO_PI_MAX_CONCURRENCY:-4}
      # A canvas plan is one long structured JSON answer, so the output cap is the binding limit,
      # not the context window. At 4096 output tokens a seven-node plan was cut off mid-string and
      # the run failed as runtime_failed / invalid_canvas_plan; a measured real plan needs ~4.5k
      # characters and 32 operations. Raise both, keeping maxTokens + 256 < contextWindow, and stay
      # well inside what the served model advertises (qwen3.8-27b reports 262144).
      AWWO_PI_CONTEXT_WINDOW: ${AWWO_PI_CONTEXT_WINDOW:-131072}
      AWWO_PI_MAX_TOKENS: ${AWWO_PI_MAX_TOKENS:-16384}
      # Must stay below the api's AWWO_RUN_TIMEOUT and nginx's proxy_read_timeout, or a healthy
      # long generation is killed by the shortest link in the chain.
      AWWO_PI_TIMEOUT_MS: ${AWWO_PI_TIMEOUT_MS:-300000}
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 2g
    init: true
    restart: unless-stopped
    networks: [private, egress]
  openai-agents:
    build:
      context: ../..
      dockerfile: deploy/saas/openai-agents.Dockerfile
    # Only this worker receives its optional profile-specific credentials.
    env_file:
      - path: ${AWWO_OPENAI_AGENTS_PROFILES_ENV_FILE:-./openai-agents-profiles.env}
        required: false
    environment:
      <<: *backend-telemetry
      APP_ENV: ${APP_ENV:-staging}
      OTEL_SERVICE_NAME: awwo-openai-agents-worker
      AWWO_OPENAI_AGENTS_HOST: 0.0.0.0
      AWWO_OPENAI_AGENTS_PORT: 8098
      AWWO_OPENAI_AGENTS_TOKEN: ${AWWO_OPENAI_AGENTS_TOKEN:?Set a dedicated OpenAI Agents internal token}
      AWWO_OPENAI_AGENTS_PROVIDER: ${AWWO_OPENAI_AGENTS_PROVIDER:-openai}
      AWWO_OPENAI_AGENTS_MODEL: ${AWWO_OPENAI_AGENTS_MODEL:-}
      AWWO_OPENAI_AGENTS_BASE_URL: ${AWWO_OPENAI_AGENTS_BASE_URL:-}
      AWWO_OPENAI_AGENTS_API_KEY: ${AWWO_OPENAI_AGENTS_API_KEY:-}
      AWWO_OPENAI_AGENTS_PROTOCOL: ${AWWO_OPENAI_AGENTS_PROTOCOL:-chat_completions}
      AWWO_OPENAI_AGENTS_MODELS_JSON: ${AWWO_OPENAI_AGENTS_MODELS_JSON:-}
      AWWO_OPENAI_AGENTS_TOOLS_JSON: ${AWWO_OPENAI_AGENTS_TOOLS_JSON:-[]}
      AWWO_OPENAI_AGENTS_MAX_CONCURRENCY: ${AWWO_OPENAI_AGENTS_MAX_CONCURRENCY:-4}
      AWWO_OPENAI_AGENTS_CONTEXT_WINDOW: ${AWWO_OPENAI_AGENTS_CONTEXT_WINDOW:-32768}
      AWWO_OPENAI_AGENTS_MAX_TOKENS: ${AWWO_OPENAI_AGENTS_MAX_TOKENS:-4096}
      AWWO_OPENAI_AGENTS_TIMEOUT_MS: ${AWWO_OPENAI_AGENTS_TIMEOUT_MS:-120000}
      AWWO_OPENAI_AGENTS_CANCEL_GRACE_MS: ${AWWO_OPENAI_AGENTS_CANCEL_GRACE_MS:-2000}
      AWWO_OPENAI_AGENTS_MAX_OUTPUT_BYTES: ${AWWO_OPENAI_AGENTS_MAX_OUTPUT_BYTES:-1048576}
      OPENAI_AGENTS_DISABLE_TRACING: "1"
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 2g
    init: true
    restart: unless-stopped
    networks: [private, egress]
  api:
    build:
      context: ../..
      dockerfile: deploy/saas/api.Dockerfile
    environment:
      <<: *backend-telemetry
      APP_ENV: ${APP_ENV:-staging}
      OTEL_SERVICE_NAME: awwo-api
      AWWO_METRICS_LISTEN_ADDR: ${AWWO_METRICS_LISTEN_ADDR:-127.0.0.1:9101}
      AWWO_MODEL_PRICING_JSON: ${AWWO_MODEL_PRICING_JSON:-}
      AWWO_USAGE_RETENTION_DAYS: ${AWWO_USAGE_RETENTION_DAYS:-180}
      AWWO_LISTEN_ADDR: 0.0.0.0:8087
      AWWO_PUBLIC_ORIGIN: ${AWWO_PUBLIC_ORIGIN:?Set the HTTPS public origin}
      AWWO_DATABASE_URL: ${AWWO_DATABASE_URL:?Set the dedicated PostgreSQL connection URL}
      AWWO_PI_URL: http://pi:8097
      AWWO_PI_SESSION_WAIT: ${AWWO_PI_SESSION_WAIT:-5s}
      # Without this the Go default of 180s applies, which is shorter than a legitimate long
      # generation and would cancel it. It must sit between AWWO_PI_TIMEOUT_MS (300s) and this
      # deployment's nginx proxy_read_timeout (660s in ./nginx.conf) so the model layer is what
      # gives up first. Raising it past nginx buys nothing: nginx cuts the response either way.
      AWWO_RUN_TIMEOUT: ${AWWO_RUN_TIMEOUT:-600s}
      AWWO_PI_TOKEN: ${AWWO_PI_TOKEN:?Set a dedicated internal token}
      AWWO_OPENAI_AGENTS_URL: http://openai-agents:8098
      AWWO_OPENAI_AGENTS_TOKEN: ${AWWO_OPENAI_AGENTS_TOKEN:?Set a dedicated OpenAI Agents internal token}
      AWWO_BOOTSTRAP_ADMIN_EMAIL: ${AWWO_BOOTSTRAP_ADMIN_EMAIL:?Set the initial administrator email}
      AWWO_BOOTSTRAP_ADMIN_PASSWORD: ${AWWO_BOOTSTRAP_ADMIN_PASSWORD:?Set an initial administrator password}
      AWWO_TRUSTED_PROXY_CIDRS: ${AWWO_TRUSTED_PROXY_CIDRS:-}
    depends_on:
      database: { condition: service_healthy }
      pi: { condition: service_started }
      openai-agents: { condition: service_started }
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 512m
    restart: unless-stopped
    networks: [private]
  web:
    build:
      context: ../..
      dockerfile: deploy/saas/web.Dockerfile
    ports:
      - 127.0.0.1:${AWWO_INGRESS_PORT:-8189}:8080
    depends_on: [api]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    networks: [private]
volumes:
  postgres-data:
networks:
  private:
    internal: true
  egress:
