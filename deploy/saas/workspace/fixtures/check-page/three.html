<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fixture: three.js from a CDN</title>
<!-- The import map a three.js page uses: the check answers exactly the version the image carries from its own copy. -->
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://unpkg.com/three@0.186.1/examples/jsm/"}}</script>
<style>html, body { margin: 0; height: 100%; background: #101018; }</style>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { ImprovedNoise } from 'three/addons/math/ImprovedNoise.js';
// A lit, spinning box on a coloured background, read back from the drawing buffer.
const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
renderer.setSize(320, 240);
document.body.append(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x203060);
const camera = new THREE.PerspectiveCamera(50, 320 / 240, 0.1, 100);
camera.position.set(0, 0, 4);
const box = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.4, 1.4), new THREE.MeshStandardMaterial({ color: 0xffaa33 }));
scene.add(box, new THREE.HemisphereLight(0xffffff, 0x333344, 3));
box.rotation.set(0.5, 0.7, 0);
renderer.render(scene, camera);
const pixel = new Uint8Array(4), gl = renderer.getContext();
gl.readPixels(160, 120, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixel);
const noise = new ImprovedNoise().noise(0.3, 0.7, 0.1);
// As in AwwO's preview, a .min.js names the same file (the preview supplies SimplexNoise.js), here from another jsDelivr host.
const simplex = await import('https://fastly.jsdelivr.net/npm/three@0.186.1/examples/jsm/math/SimplexNoise.min.js')
  .then(module => new module.SimplexNoise().noise(0.3, 0.7), error => String(error));
// A file of the same release that the preview does not supply stays blocked, as the preview's page would find it.
const gui = await import('https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/libs/lil-gui.module.min.js').then(() => 'loaded', () => 'refused');
window.awwoSelfTest = async () => ({ tests: [
  { name: 'three.js 0.186.1 loaded', ok: THREE.REVISION === '186', detail: THREE.REVISION },
  { name: 'an addon loaded through three/addons/', ok: Number.isFinite(noise) && noise !== 0, detail: String(noise) },
  { name: 'a .min.js addon from another jsDelivr host', ok: Number.isFinite(simplex), detail: String(simplex) },
  { name: 'a file the preview does not supply stays blocked', ok: gui === 'refused', detail: gui },
  { name: 'the box is drawn over the background', ok: pixel[0] > pixel[2], detail: `rgba ${[...pixel].join(',')}` },
] });
</script>
</body>
</html>
