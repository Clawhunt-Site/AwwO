<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fixture: WebGL draws</title>
<style>html, body { margin: 0; height: 100%; background: #101418; } canvas { display: block; width: 100vw; height: 100vh; }</style>
</head>
<body>
<canvas id="scene" width="640" height="400"></canvas>
<script>
// A WebGL triangle, the way a three.js page starts: without WebGL in the browser the page throws.
const canvas = document.getElementById('scene');
const gl = canvas.getContext('webgl', { preserveDrawingBuffer: true });
if (!gl) throw new Error('fixture: WebGL is not available');
const shader = (type, source) => { const s = gl.createShader(type); gl.shaderSource(s, source); gl.compileShader(s); return s; };
const program = gl.createProgram();
gl.attachShader(program, shader(gl.VERTEX_SHADER, 'attribute vec2 p; void main() { gl_Position = vec4(p, 0.0, 1.0); }'));
gl.attachShader(program, shader(gl.FRAGMENT_SHADER, 'precision mediump float; void main() { gl_FragColor = vec4(0.9, 0.5, 0.1, 1.0); }'));
gl.linkProgram(program);
gl.useProgram(program);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-0.8, -0.8, 0.8, -0.8, 0.0, 0.8]), gl.STATIC_DRAW);
const position = gl.getAttribLocation(program, 'p');
gl.enableVertexAttribArray(position);
gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);
gl.clearColor(0.06, 0.08, 0.1, 1);
gl.clear(gl.COLOR_BUFFER_BIT);
gl.drawArrays(gl.TRIANGLES, 0, 3);
window.awwoSelfTest = async () => {
  const pixel = new Uint8Array(4);
  gl.readPixels(320, 200, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixel);
  return { tests: [
    { name: 'a WebGL context exists', ok: !!gl, detail: gl.getParameter(gl.VERSION) },
    { name: 'the triangle is drawn at the centre', ok: pixel[0] > 200 && pixel[2] < 60, detail: `rgba(${pixel.join(', ')})` },
  ] };
};
</script>
</body>
</html>
