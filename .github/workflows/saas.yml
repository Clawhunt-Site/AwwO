name: SaaS accounts

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: saas-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  accounts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_USER: awwo
          POSTGRES_PASSWORD: synthetic-ci-password
          POSTGRES_DB: awwo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U awwo -d awwo_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/pi-worker/package-lock.json
            apps/openai-agents-worker/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install application dependencies
        run: |
          npm ci --prefix apps/web
          npm ci --ignore-scripts --prefix apps/pi-worker
          npm ci --ignore-scripts --prefix apps/openai-agents-worker
      - name: Account and database regressions
        working-directory: backend
        env:
          AWWO_TEST_DATABASE_URL: postgres://awwo:synthetic-ci-password@127.0.0.1:5432/awwo_test?sslmode=disable
        run: |
          go test -race -count=1 ./...
          go vet ./...
      - name: Worker isolation and startup regressions
        run: |
          npm run test:user-models
          npm run test:saas:pi
          npm run test:saas:openai-agents
          npm run test:saas:scripts
      - name: Web regressions and production build
        run: |
          npm run test:saas --prefix apps/web
          npm run typecheck:saas --prefix apps/web
          npm run build:saas
      - name: Build production containers
        run: |
          docker build -f deploy/saas/api.Dockerfile -t awwo-api:ci .
          docker build -f deploy/saas/pi.Dockerfile -t awwo-pi:ci .
          docker build -f deploy/saas/openai-agents.Dockerfile -t awwo-openai-agents:ci .
          docker build -f deploy/saas/web.Dockerfile -t awwo-web:ci .
